name: Import ZIP from Google Drive (debug)

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive file id (from /d/FILE_ID/)'
        required: true
      branch_name:
        description: 'Branch name to create'
        required: false
        default: 'upload-from-drive'
      commit_message:
        description: 'Commit message for the upload commit'
        required: false
        default: 'Add project files from Drive ZIP'
      pr_title:
        description: 'Pull request title'
        required: false
        default: 'Add project files from Drive ZIP'
      pr_body:
        description: 'Pull request body'
        required: false
        default: 'Imported files from Google Drive ZIP.'
      overwrite:
        description: 'Set to "true" to overwrite existing files, "false" to keep existing files'
        required: false
        default: 'true'

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Debug - show runner info
        run: |
          echo "Runner: $(uname -a)"
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Actor: $GITHUB_ACTOR"
          python --version
          which pip || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet gdown || { echo "pip install gdown failed"; exit 1; }

      - name: Download ZIP from Google Drive (with fallback)
        env:
          FILE_ID: ${{ github.event.inputs.drive_file_id }}
        run: |
          set -euxo pipefail
          echo "Drive file id: $FILE_ID"
          # Attempt gdown first
          if command -v gdown >/dev/null 2>&1 ; then
            gdown --id "$FILE_ID" -O upload.zip || echo "gdown failed with exit $?"
          fi
          # Check if file downloaded
          if [ ! -f upload.zip ] || [ ! -s upload.zip ]; then
            echo "gdown didn't produce upload.zip or file is empty; trying wget fallback"
            # Simple wget/curl fallback (may fail with large files that require confirm token)
            curl -L "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o upload.zip || true
          fi
          # Inspect download
          if [ -f upload.zip ]; then
            echo "Downloaded upload.zip size:"
            ls -lh upload.zip
            echo "Test archive integrity (if possible):"
            unzip -t upload.zip || echo "zip test failed (may still unzip)"
            unzip -o upload.zip -d upload || { echo "unzip failed"; ls -la; exit 1; }
            echo "Extracted files:"
            ls -la upload | head -n 200 || true
          else
            echo "ERROR: upload.zip not found after download attempts."
            echo "Make sure file id is correct AND the Drive file is set to 'Anyone with the link' (Viewer)."
            exit 1
          fi

      - name: Create branch for upload
        run: |
          set -euxo pipefail
          BR="${{ github.event.inputs.branch_name }}"
          if [ -z "$BR" ]; then BR="upload-from-drive"; fi
          echo "Creating branch: $BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"

      - name: Copy files into repo (show what will change)
        run: |
          set -euxo pipefail
          echo "Files inside upload/ (first 200 lines):"
          find upload -maxdepth 3 -type f -print | sed -n '1,200p' || true
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then
            rsync -av --exclude='.git' upload/ .
          else
            rsync -av --ignore-existing --exclude='.git' upload/ .
          fi
          echo "Files changed (git status):"
          git status --porcelain

      - name: Commit and push changes (show output)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git add -A
          git commit -m "${{ github.event.inputs.commit_message }}" || echo "No changes to commit"
          # Ensure remote uses token (persist-credentials should work but set explicitly for clarity)
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push --set-upstream origin HEAD -v

      - name: Create Pull Request (and print response)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.inputs.pr_title }}
          PR_BODY: ${{ github.event.inputs.pr_body }}
        run: |
          set -euxo pipefail
          python - <<PY
import os,json,urllib.request,subprocess
repo = os.environ['GITHUB_REPOSITORY']
token = os.environ['GITHUB_TOKEN']
req = urllib.request.Request(f"https://api.github.com/repos/{repo}", headers={"Authorization":f"token {token}"})
info = json.load(urllib.request.urlopen(req))
def_branch = info.get('default_branch')
BR = subprocess.check_output(["git","rev-parse","--abbrev-ref","HEAD"]).decode().strip()
payload = {"title": os.environ.get('PR_TITLE','Add files from Drive ZIP'), "head": BR, "base": def_branch, "body": os.environ.get('PR_BODY','Imported from Drive ZIP')}
req = urllib.request.Request(f"https://api.github.com/repos/{repo}/pulls", data=json.dumps(payload).encode(), headers={"Authorization":f"token {token}", "Content-Type":"application/json"})
resp = urllib.request.urlopen(req).read().decode()
print(resp)
PY
